<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyTrader Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero panel">
        <div>
          <h1>PolyTrader Dashboard</h1>
          <p class="muted hero-copy">Dashboard açılınca tracker da arka planda çalışır. Şehir + tarih seç, event bazlı fiyat akışını ve hava tahmini değişim çizgilerini izle.</p>
        </div>
        <div class="hero-status">
          <div class="status-pill">Polymarket: 1 dk</div>
          <div class="status-pill">Forecast: 5 dk</div>
          <div class="status-pill">Discovery: 30 dk</div>
        </div>
      </header>

      <section class="controls panel">
        <div class="field">
          <label for="citySelect">Şehir</label>
          <select id="citySelect"></select>
        </div>
        <div class="field">
          <label for="dateSelect">Tarih</label>
          <select id="dateSelect"></select>
        </div>
        <div class="field">
          <label for="intervalSelect">Data point aralığı</label>
          <select id="intervalSelect">
            <option value="1m">Dakikalık</option>
            <option value="5m" selected>5 dakikalık</option>
            <option value="15m">15 dakikalık</option>
            <option value="30m">Yarım saatlik</option>
            <option value="1h">Saatlik</option>
          </select>
        </div>
        <div class="field button-field">
          <button id="reloadButton" type="button">Yenile</button>
        </div>
      </section>

      <section class="stats-grid" id="statsGrid"></section>

      <section class="panel chart-panel">
        <div class="chart-nav">
          <div class="nav-group">
            <label for="windowSizeSelect">Görünür pencere</label>
            <select id="windowSizeSelect">
              <option value="all">Tümü</option>
              <option value="12">12 nokta</option>
              <option value="24" selected>24 nokta</option>
              <option value="48">48 nokta</option>
              <option value="96">96 nokta</option>
            </select>
          </div>
          <div class="nav-group nav-slider-group">
            <label for="panSlider">Zamanda kaydır</label>
            <input id="panSlider" type="range" min="0" max="0" value="0" step="1" />
            <div id="panHint" class="muted pan-hint"></div>
          </div>
        </div>
        <div class="chart-header">
          <div>
            <h2 id="chartTitle">Event grafiği</h2>
            <div id="chartSubtitle" class="muted"></div>
          </div>
          <div id="legend" class="legend"></div>
        </div>
        <div class="chart-wrap">
          <svg id="chartSvg" viewBox="0 0 1200 520" preserveAspectRatio="none"></svg>
          <div id="chartTooltip" class="chart-tooltip hidden"></div>
        </div>
      </section>

      <section class="panel table-panel">
        <div class="table-header">
          <h2>Son snapshot özeti</h2>
          <span id="tableHint" class="muted"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Bucket</th>
                <th>YES %</th>
                <th>NO %</th>
                <th>YES bid</th>
                <th>YES ask</th>
                <th>NO bid</th>
                <th>NO ask</th>
              </tr>
            </thead>
            <tbody id="marketTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/app.js?v=dashboard-v3" defer></script>
  </body>
</html>
